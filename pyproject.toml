[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vectorlab-numpy"
version = "0.1.0"
description = "Inspectable NumPy HNSW and exact KD-tree with reproducible retrieval evaluation"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.8,<3"]

[project.optional-dependencies]
evaluation = ["sentence-transformers>=3,<7", "datasets>=3,<6", "matplotlib>=3.9,<4"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["vectorlab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
